[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docketry"
version = "0.16.0"
description = "A local, gate-enforced port that a law firm's email flows into. Base layer for small composable legal workflow tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["legal", "email", "pipeline", "guardrails", "law"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Legal Industry",
]
# The core is intentionally stdlib-only.
dependencies = []

[project.optional-dependencies]
# Feature plugins declare their own external needs (see FEATURES.md).
pdf = ["pypdf>=4"]
ocr = ["pytesseract>=0.3", "Pillow>=10"]   # requires the Tesseract binary on the system
docx = ["python-docx>=1"]
cite = ["eyecite>=2", "httpx>=0.27"]
export = ["openpyxl>=3", "python-docx>=1"]   # Excel + Word timeline export

[project.scripts]
docketry = "docketry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["docketry"]
