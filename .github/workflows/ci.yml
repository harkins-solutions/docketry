name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The redaction path is the destructive one, so CI runs it for real
      # rather than skipping it: without these the OCR tests skip and the
      # only feature that can leak a client's data goes unexercised.
      - name: Install OCR toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - name: Install feature extras
        run: pip install pypdf python-docx eyecite httpx coverage openpyxl pytesseract Pillow
      - name: Run tests with coverage
        env:
          DOCKETRY_LEAK_SALT: ${{ secrets.DOCKETRY_LEAK_SALT }}
        run: |
          coverage run --source=docketry -m unittest discover -s tests -v
          coverage report --fail-under=85
