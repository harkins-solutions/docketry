# Who may release what. Copy to your Docketry home as roles.toml and rewrite
# it for your firm; the names below are placeholders.
#
# Optional. Without this file, an approval's --role must equal the gate's
# `authority` exactly, and nothing checks that the authority names a role the
# firm actually has.
#
# With it:
#   * a gate or workflow naming an undeclared role is refused when config
#     loads, not when someone needs to release something;
#   * may_release lets a role clear gates whose authority names another role
#     ("*" clears anything), so an attorney can release a paralegal's hold;
#   * a person listed below cannot approve under a role they do not hold.
#
# Docketry has no login. A role is a name typed at approval time and checked
# against this file: it catches mistakes, not lies.

# These two names match the shipped guardrail examples, so copying this file
# in does not immediately refuse your manifest. Rename them to whatever your
# firm calls these jobs, and update the `authority` values to match.

[[role]]
name = "paralegal"
description = "Clears routine intake holds."
may_release = ["sender-scope", "attachment-policy", "notice-parser",
               "doc-classifier"]

[[role]]
name = "attorney"
description = "Releases anything."
may_release = ["*"]

# People are optional. List someone and they cannot approve under a role not
# listed here; leave the section out and any name may claim any declared role.
# [[person]]
# name = "Dana Reyes"
# roles = ["staff"]
