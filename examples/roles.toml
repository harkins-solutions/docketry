# Who may release what. Copy this to your Docketry home as roles.toml and
# rewrite it for your firm — the names below are placeholders, not advice.
#
# Optional. Without this file nothing validates the `authority` values in your
# guardrails and workflows, which is how Docketry behaved before it existed.
# With it, a gate or a workflow that names a role you have not declared is
# refused when the config loads, rather than at the moment someone needs it.
#
# may_release lets seniority work. A role listed against a gate id can release
# that gate even when the gate names someone else; "*" releases anything.
# Without it, someone senior is blocked by a hold meant for someone junior.
#
# A role here is an attestation recorded against a name. Docketry has no login.
# This catches mistakes; it does not authenticate anyone.

# These two match the roles used by the guardrail examples that ship with
# Docketry, so copying this file in does not immediately refuse your manifest.
# Rename them the moment they stop matching what your firm actually calls
# these jobs — a registry that disagrees with your vocabulary is worse than
# none, because people start working around it.

[[role]]
name = "paralegal"
description = "Clears routine intake holds."
may_release = ["sender-scope", "attachment-policy", "notice-parser",
               "doc-classifier"]

[[role]]
name = "attorney"
description = "Releases anything."
may_release = ["*"]

# People are optional. List someone and Docketry will refuse a role they do
# not hold; leave the list out entirely and any name may claim any role.
# [[person]]
# name = "Dana Reyes"
# roles = ["staff"]
