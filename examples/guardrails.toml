# Example intake pipeline for a small litigation firm.
#
# Stages run left to right. A gate's binds_to must fall within the stages that
# gate declares in allowed_stages; binding it elsewhere refuses to load.

[pipeline]
stages = ["ingest", "review"]

# Conflict screen. Uncomment and list your own parties: a message naming one
# gets status `blocked` until the role below releases it, and the release is
# recorded with a name, a role and a timestamp. Terms stay in this file.
#
# [[gate]]
# id = "name-screen"
# binds_to = ["ingest"]
# on_fail = "block"
# authority = "attorney"
#
# [gate.options]
# terms = ["Walled Party LLC", "Confidential Matter Name"]
# note = "ethical wall"

[[gate]]
id = "notice-parser"
binds_to = ["ingest"]
on_fail = "bounce"          # a court notice that no longer parses is reviewed, not dropped
authority = "paralegal"

# Below: which senders and attachments intake accepts.
[[gate]]
id = "sender-scope"
binds_to = ["ingest"]
on_fail = "bounce"          # unexpected senders park for a human, never flow through
authority = "paralegal"

[gate.options]
allow = ["@myflcourtaccess.com", "@stlucieclerk.com", "@examplefirm.com"]

[[gate]]
id = "attachment-policy"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[gate.options]
max_size_mb = 25

[[gate]]
id = "provenance-stamp"
binds_to = ["ingest"]
on_fail = "warn"
authority = "paralegal"

# Optional: a sender deny list, checked before the allow list above.
