# Litigation team. Conflict screen and court notices first; paralegals clear
# the routine holds; classification proposals go to the queue for approval.

[pipeline]
stages = ["ingest", "review"]

# Conflict screen. Terms match case-insensitively on word boundaries in the
# subject, body and attachment filenames. A match sets status `blocked` until
# an attorney releases it. Replace these terms with your own.
[[gate]]
id = "name-screen"
binds_to = ["ingest"]
on_fail = "block"
authority = "attorney"

[gate.options]
terms = ["Walled Party LLC", "Confidential Matter Name"]
note = "ethical wall"

# Court notices. Anything the adapters cannot fully parse goes to the review
# queue rather than being stored half-extracted.
[[gate]]
id = "notice-parser"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

# Below: sender and attachment policy, and the provenance record.
[[gate]]
id = "sender-scope"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[gate.options]
allow = ["@myflcourtaccess.com", "@uscourts.gov", "@efilingmail.tylertech.cloud"]

[[gate]]
id = "attachment-policy"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[gate.options]
max_size_mb = 50

[[gate]]
id = "doc-classifier"
binds_to = ["ingest"]
on_fail = "warn"            # informational: proposals land in class-queue
authority = "paralegal"

[[gate]]
id = "provenance-stamp"
binds_to = ["ingest"]
on_fail = "warn"
authority = "paralegal"
