# Litigation team: paralegals clear routine holds, classification proposals
# flow to the queue, provenance always recorded.

[pipeline]
stages = ["ingest", "review"]

[[gate]]
id = "sender-scope"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[gate.options]
allow = ["@myflcourtaccess.com", "@uscourts.gov", "@efilingmail.tylertech.cloud"]

[[gate]]
id = "attachment-policy"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[gate.options]
max_size_mb = 50

[[gate]]
id = "notice-parser"
binds_to = ["ingest"]
on_fail = "bounce"
authority = "paralegal"

[[gate]]
id = "doc-classifier"
binds_to = ["ingest"]
on_fail = "warn"            # informational: proposals land in class-queue
authority = "paralegal"

[[gate]]
id = "provenance-stamp"
binds_to = ["ingest"]
on_fail = "warn"
authority = "paralegal"
