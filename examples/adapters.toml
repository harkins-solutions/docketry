# Firm-defined notice adapters. Drop this file in your Docketry home directory
# as adapters.toml and `docketry poll` consults it before the built-ins, so a
# local template can override a shipped one.
#
# Each field pattern is a regular expression with exactly ONE capture group.
# A field listed in `required` that fails to extract bounces the message to
# the review queue (when the notice-parser gate is bound with on_fail =
# "bounce") — a source that changed its template fails loudly, never silently.

[[adapter]]
name = "st-lucie-ja-hearing"
notice_type = "hearing_notice"
required = ["hearing_date"]

[adapter.match]
from = "@stlucieclerk.com"
subject_contains = "Hearing"

[adapter.fields]
hearing_date = 'Hearing Date\s*:?\s*(\d{1,2}/\d{1,2}/\d{4})'
hearing_time = 'Time\s*:?\s*(\d{1,2}:\d{2}\s*[AP]M)'
judge = 'Judge\s*:?\s*(.+)'
case_number = 'Case\s*(?:Number|No\.?)\s*:?\s*([A-Z0-9-]+)'
